name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  verify:
    name: Verify Quality, Types, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Code Quality & Lint Hygiene
        run: npm run lint

      - name: Code Style & Prettier Formatting
        run: npm run format:check

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Type Checking Across Workspaces
        run: npm run typecheck

      - name: Automated Unit & API Tests
        run: npm run test

      - name: Production Bundling / Build Verification
        run: npm run build
